```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainBox Learning - Sign In</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background-color: #050b1b;
      background-image:
        linear-gradient(#14234455 1px, transparent 1px),
        linear-gradient(90deg, #14234455 1px, transparent 1px);
      background-size: 35px 35px;
    }

    .container {
      width: 90%;
      max-width: 420px;
      padding: 35px;
      text-align: center;
      background: #0b1530;
      border: 1px solid #2864ff;
      border-radius: 18px;
      box-shadow: 0 0 30px #1765ff33;
    }

    h1 {
      color: #65a0ff;
    }

    p {
      color: #c4d0e8;
      line-height: 1.6;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #35518a;
      border-radius: 8px;
      background: #101e3d;
      color: white;
      font-size: 16px;
    }

    button, .back {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    .continue {
      background: #3478ff;
      color: white;
    }

    .skip {
      background: #1a2949;
      color: white;
    }

    .back {
      color: #9dbbff;
      background: transparent;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>BrainBox Learning</h1>
    <p>Enter your email and password to continue.</p>

    <form id="signinForm">
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button class="continue" type="submit">Continue</button>
    </form>

    <button class="skip" id="skipButton" type="button">
      Skip for Now
    </button>

    <a class="back" href="index.html">Back</a>
  </div>

  <script>
    // Start without a previous sign-in flag.
    sessionStorage.removeItem("brainboxSignedIn");

    const form = document.getElementById("signinForm");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password || !form.checkValidity()) {
        form.reportValidity();
        return;
      }

      sessionStorage.setItem("brainboxSignedIn", "true");
      window.location.href = "page3.html";
    });

    document.getElementById("skipButton").addEventListener("click", function() {
      sessionStorage.removeItem("brainboxSignedIn");
      window.location.href = "page3.html";
    });
  </script>
</body>
</html>
