```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainBox Learning - Sign Up</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background-color: #050b1b;
      background-image:
        linear-gradient(#14234455 1px, transparent 1px),
        linear-gradient(90deg, #14234455 1px, transparent 1px);
      background-size: 35px 35px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 40px 30px;
      text-align: center;
      background: rgba(7, 23, 52, 0.96);
      border: 1px solid #2864ff;
      border-radius: 20px;
      box-shadow: 0 0 30px #1765ff33;
    }

    .logo {
      color: #65a0ff;
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #c4d0e8;
      line-height: 1.6;
    }

    .field {
      text-align: left;
      margin-top: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #dce7ff;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #36558c;
      border-radius: 9px;
      outline: none;
      background: #0b1730;
      color: white;
      font-size: 16px;
    }

    input:focus {
      border-color: #65a0ff;
      box-shadow: 0 0 10px #3478ff55;
    }

    .button {
      display: block;
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(90deg, #3478ff, #7155ff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .button:hover {
      opacity: 0.9;
    }

    .skip {
      display: inline-block;
      margin-top: 20px;
      color: #9dbbff;
      text-decoration: none;
    }

    .back {
      display: block;
      margin-top: 22px;
      color: #9dbbff;
      text-decoration: none;
    }

    .message {
      margin-top: 15px;
      color: #ffb4b4;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .container {
        padding: 30px 20px;
      }

      .logo {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <main class="container">
    <div class="logo">BrainBox Learning</div>

    <h1>Create Your Account</h1>
    <p>Enter your email and password to continue your learning journey.</p>

    <form id="signupForm">
      <div class="field">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="new-password"
          minlength="6"
          required
        >
      </div>

      <button class="button" type="submit">Continue</button>

      <div class="message" id="message" role="alert"></div>
    </form>

    <a class="skip" href="page3.html" id="skipLink">Skip for Now</a>
    <a class="back" href="index.html">← Back to Home</a>
  </main>

  <script>
    const signupForm = document.getElementById("signupForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");

    signupForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        message.textContent = "Please enter your email and password.";
        return;
      }

      if (!emailInput.validity.valid) {
        message.textContent = "Please enter a valid email address.";
        return;
      }

      if (password.length < 6) {
        message.textContent = "Your password must be at least 6 characters.";
        return;
      }

      // Demo only: stores information for the next page in this tab.
      // Do not use browser storage for real passwords or authentication.
      sessionStorage.setItem("brainboxEmail", email);

      // Remove any old demo password value.
      sessionStorage.removeItem("brainboxPassword");

      window.location.href = "page3.html";
    });

    document.getElementById("skipLink").addEventListener("click", function() {
      sessionStorage.removeItem("brainboxEmail");
      sessionStorage.removeItem("brainboxPassword");
    });
  </script>

</body>
</html>
```
