
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainBox Learning - Sign In</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eaf3ff, #e9f8ef);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #24324a;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 460px;
      padding: 38px 30px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(40, 75, 120, 0.12);
      text-align: center;
    }

    .logo {
      font-size: 36px;
      margin-bottom: 10px;
    }

    h1 {
      color: #2d5fa8;
      font-size: 30px;
      margin: 0 0 10px;
    }

    .subtitle {
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #334155;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #d8e4f2;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #477bc5;
      box-shadow: 0 0 0 3px rgba(71, 123, 197, 0.12);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .continue-button {
      background: #416fc4;
      color: white;
    }

    .continue-button:hover {
      background: #2d55a1;
    }

    .skip-button {
      background: #edf3fa;
      color: #36516f;
    }

    .skip-button:hover {
      background: #dce8f6;
    }

    #message {
      color: #c0392b;
      font-size: 14px;
      margin-top: 14px;
      min-height: 18px;
    }

    .privacy-note {
      color: #7b8798;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 20px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 22px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">🧠</div>

    <h1>BrainBox Learning</h1>

    <p class="subtitle">
      Enter your email and password to personalize your learning experience!
    </p>

    <form id="signInForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="continue-button">
        Continue
      </button>

      <button type="button" class="skip-button" id="skipButton">
        Skip
      </button>

      <p id="message" role="alert"></p>
    </form>

    <p class="privacy-note">
      This is a demonstration website. Your details are stored in this
      browser session and are not sent to an account server.
    </p>
  </main>

  <script>
    const form = document.getElementById("signInForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const skipButton = document.getElementById("skipButton");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        message.textContent = "Please enter both your email and password.";
        return;
      }

      if (!emailInput.checkValidity()) {
        message.textContent = "Please enter a valid email address.";
        return;
      }

      try {
        // Save using the exact keys read by page6.html.
        sessionStorage.setItem("brainboxEmail", email);
        sessionStorage.setItem("brainboxPassword", password);

        // Verify that the email was saved.
        if (sessionStorage.getItem("brainboxEmail") !== email) {
          message.textContent = "Could not save your email. Please try again.";
          return;
        }

        // Keep the saved information while moving through the pages.
        window.location.href = "page3.html";
      } catch (error) {
        message.textContent =
          "Your browser could not save the information. Please check your browser settings.";
      }
    });

    skipButton.addEventListener("click", function() {
      // Skip without saving or deleting existing information.
      window.location.href = "page3.html";
    });
  </script>
</body>
</html>
