  <title>BrainBox Learning</title>

  <style>
    * {
      box-sizing: border-box;
    }

      margin: 0;

      line-height: 1.7;
      margin: 0 auto 32px;
      max-width: 550px;
    }

    .get-started {
      display: inline-block;
      background: #416fc4;
      color: white;
      text-decoration: none;
      padding: 16px 38px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      transition: background 0.2s, transform 0.2s;
    }

    .get-started:hover {
      background: #2d55a1;

      color: #8793a4;
