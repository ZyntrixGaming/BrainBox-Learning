```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainBox Learning</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #080d20, #171044, #101b3b);
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 35px;
            text-align: center;
            background: rgba(18, 25, 55, 0.95);
            border: 1px solid #6554d9;
            border-radius: 20px;
            box-shadow: 0 0 35px #6554d933;
        }

        .brain {
            font-size: 60px;
        }

        h1 {
            color: #c4b5fd;
            font-size: 32px;
            margin: 10px 0;
        }

        .subtitle {
            color: #cbd5ff;
            font-size: 12px;
            letter-spacing: 2px;
            line-height: 1.8;
            margin-bottom: 28px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #4e5681;
            border-radius: 9px;
            background: #0d1430;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #a78bfa;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(90deg, #6554e8, #9333ea);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.15);
        }

        .note {
            margin-top: 22px;
            color: #9ca8d4;
            font-size: 12px;
        }

        .hidden {
            display: none;
        }

        #message {
            color: #fca5a5;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="brain">🧠</div>

        <h1>BrainBox Learning</h1>

        <p class="subtitle">
            THINK BIG. LEARN MORE.<br>
            DISCOVER EVERYTHING.
        </p>

        <!-- Welcome screen -->
        <div id="welcomeScreen">
            <button id="getStarted">Get Started</button>
            <p class="note">Start exploring. Keep discovering.</p>
        </div>

        <!-- Email and password screen -->
        <div id="signupScreen" class="hidden">
            <h2>Join BrainBox!</h2>
            <p class="subtitle">CREATE YOUR ACCOUNT TO CONTINUE</p>

            <form id="signupForm">
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password (8+ characters)"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button type="submit">Continue</button>
                <p id="message"></p>
            </form>

            <button id="backButton" type="button">Back</button>
        </div>
    </div>

    <script>
        const welcomeScreen = document.getElementById("welcomeScreen");
        const signupScreen = document.getElementById("signupScreen");

        document.getElementById("getStarted").addEventListener("click", function() {
            welcomeScreen.classList.add("hidden");
            signupScreen.classList.remove("hidden");
        });

        document.getElementById("backButton").addEventListener("click", function() {
            signupScreen.classList.add("hidden");
            welcomeScreen.classList.remove("hidden");
            document.getElementById("message").textContent = "";
        });

        document.getElementById("signupForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || password.length < 8) {
                document.getElementById("message").textContent =
                    "Enter a valid email and a password with at least 8 characters.";
                return;
            }

            // Demo only: this does not create a real account.
            window.location.href = "page2.html";
        });
    </script>
</body>
</html>
