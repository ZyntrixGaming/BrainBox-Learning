
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainBox Learning</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 20% 20%,
                    #123b80 0%, transparent 40%),
                radial-gradient(ellipse at 85% 80%,
                    #35116e 0%, transparent 40%),
                linear-gradient(135deg,
                    #020817, #071632, #030615);
            color: white;
        }

        /* Glowing background lights */
        .glow {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.45;
            animation: float 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .blue {
            background: #0077ff;
            top: -120px;
            left: -100px;
        }

        .purple {
            background: #792cff;
            bottom: -150px;
            right: -80px;
            animation-delay: 2s;
        }

        /* Small glowing particles */
        .stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle, #35cfff 1px, transparent 2px),
                radial-gradient(circle, #7865ff 1px, transparent 2px);
            background-size: 100px 100px, 145px 145px;
            background-position: 10px 20px, 50px 70px;
            opacity: 0.35;
            animation: sparkle 5s ease-in-out infinite alternate;
            pointer-events: none;
        }

        /* Center content */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Custom neon brain icon */
        .brain {
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px #00aaff);
            animation: float 3s ease-in-out infinite alternate;
        }

        .brain svg {
            display: block;
            width: 100px;
            height: 100px;
        }

        h1 {
            font-size: clamp(42px, 8vw, 85px);
            letter-spacing: 2px;
            text-shadow: 0 0 25px #167dff55;
        }

        h1 span {
            background: linear-gradient(90deg, #25d9ff, #7375ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            margin-top: 22px;
            color: #b7c9e8;
            font-size: 18px;
            letter-spacing: 2px;
            line-height: 1.8;
        }

        @keyframes float {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-18px);
            }
        }

        @keyframes sparkle {
            from {
                opacity: 0.18;
            }
            to {
                opacity: 0.45;
            }
        }

        @media (max-width: 500px) {
            .brain svg {
                width: 80px;
                height: 80px;
            }

            h1 {
                letter-spacing: 0;
            }

            .subtitle {
                font-size: 12px;
            }
        }

        /* Respect reduced-motion settings */
        @media (prefers-reduced-motion: reduce) {
            .glow, .stars, .brain {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <div class="glow blue"></div>
    <div class="glow purple"></div>
    <div class="stars"></div>

    <main class="container">

        <div class="brain">
            <svg viewBox="0 0 100 100"
                 fill="none"
                 xmlns="http://www.w3.org/2000/svg"
                 role="img"
                 aria-label="Neon blue brain icon">

                <defs>
                    <linearGradient id="brainGlow"
                        x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#00e5ff"/>
                        <stop offset="100%" stop-color="#3674ff"/>
                    </linearGradient>
                </defs>

                <g stroke="url(#brainGlow)"
                   stroke-width="4"
                   stroke-linecap="round"
                   stroke-linejoin="round">

                    <path d="M48 20
                             C43 8 27 11 25 23
                             C13 22 9 36 17 44
                             C7 54 15 66 23 68
                             C19 81 33 89 43 80
                             C47 76 48 70 48 64 Z"/>

                    <path d="M52 20
                             C57 8 73 11 75 23
                             C87 22 91 36 83 44
                             C93 54 85 66 77 68
                             C81 81 67 89 57 80
                             C53 76 52 70 52 64 Z"/>

                    <path d="M48 20 L48 80"/>

                    <path d="M27 29 C38 27 40 37 34 42"/>
                    <path d="M20 49 C31 44 39 51 37 59"/>
                    <path d="M30 70 C38 64 43 70 43 77"/>

                    <path d="M73 29 C62 27 60 37 66 42"/>
                    <path d="M80 49 C69 44 61 51 63 59"/>
                    <path d="M70 70 C62 64 57 70 57 77"/>
                </g>

                <!-- Neon accent rays -->
                <g stroke="#00d9ff"
                   stroke-width="3"
                   stroke-linecap="round">
                    <path d="M15 25 L9 20"/>
                    <path d="M85 25 L91 20"/>
                    <path d="M10 52 L4 52"/>
                    <path d="M90 52 L96 52"/>
                </g>
            </svg>
        </div>

        <h1>
            BrainBox <span>Learning</span>
        </h1>

        <p class="subtitle">
            THINK BIG. LEARN MORE. DISCOVER EVERYTHING.
        </p>

    </main>

</body>
</html>
