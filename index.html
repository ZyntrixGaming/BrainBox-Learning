
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 8%;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #7c83ff;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 24px;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px 20px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 76px);
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: #818cf8;
    }

    .hero p {
      color: #b8bfd3;
      font-size: 18px;
      max-width: 550px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      padding: 15px 32px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      background: #818cf8;
      transform: translateY(-2px);
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #8991a8;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">MY WEBSITE</div>

    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
      <h1>Welcome to <span>My Website</span></h1>

      <p>
        Discover something new. Explore our website
        and get started on your next adventure.
      </p>

      <a href="page2.html" class="btn">Get Started</a>
    </section>

    <section class="hero" id="about" style="min-height: 35vh;">
      <h1 style="font-size: 36px;">About Us</h1>
      <p>
        This is your website. Customize it with your
        own ideas, features, and design.
      </p>
    </section>
  </main>

  <footer>
    © 2026 My Website. All rights reserved.
  </footer>
</body>
</html>
