
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainBox Learning</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at 20% 20%, #123b80 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, #35116e 0%, transparent 40%),
                linear-gradient(135deg, #020817, #071632, #030615);
            overflow-x: hidden;
        }

        .glow {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            pointer-events: none;
            animation: float 7s ease-in-out infinite alternate;
        }

        .blue {
            background: #0077ff;
            top: -120px;
            left: -100px;
        }

        .purple {
            background: #792cff;
            bottom: -150px;
            right: -80px;
            animation-delay: 2s;
        }

        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 20px;
        }

        .brain {
            width: 100px;
            height: 100px;
            margin-bottom: 22px;
            filter: drop-shadow(0 0 15px #00cfff);
            animation: float 3s ease-in-out infinite alternate;
        }

        h1 {
            font-size: clamp(38px, 7vw, 76px);
            letter-spacing: 1px;
        }

        h1 span {
            background: linear-gradient(90deg, #25d9ff, #7375ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            margin-top: 20px;
            margin-bottom: 35px;
            color: #b7c9e8;
            font-size: 14px;
            letter-spacing: 2px;
            line-height: 1.8;
        }

        .start-button {
            padding: 16px 38px;
            border: 1px solid #46d9ff;
            border-radius: 30px;
            color: white;
            background: linear-gradient(90deg, #087cff, #604bff);
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 22px #087cff66;
            transition: 0.25s;
        }

        .start-button:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 35px #1688ffbb;
        }

        /* Email form popup */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 5;
            background: #000000bb;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 35px 25px;
            border: 1px solid #315da4;
            border-radius: 20px;
            text-align: center;
            background: linear-gradient(145deg, #101e3b, #090f20);
            box-shadow: 0 0 40px #087cff44;
        }

        .modal-content h2 {
            font-size: 27px;
            margin-bottom: 12px;
        }

        .modal-content p {
            color: #bdcbe3;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .email-input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #42618f;
            border-radius: 9px;
            outline: none;
            background: #080f20;
            color: white;
            font-size: 16px;
        }

        .email-input:focus {
            border-color: #28cfff;
            box-shadow: 0 0 10px #1688ff44;
        }

        .continue-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #1688ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .continue-button:hover {
            background: #0066d6;
        }

        .close-button {
            position: absolute;
            top: 12px;
            right: 17px;
            border: none;
            background: transparent;
            color: #bdcbe3;
            font-size: 28px;
            cursor: pointer;
        }

        #message {
            color: #54dcff;
            font-size: 14px;
            margin-top: 18px;
            overflow-wrap: anywhere;
        }

        @keyframes float {
            from { transform: translateY(0); }
            to { transform: translateY(-12px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .glow, .brain {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <div class="glow blue"></div>
    <div class="glow purple"></div>

    <main class="container">

        <svg class="brain" viewBox="0 0 100 100"
             xmlns="http://www.w3.org/2000/svg" fill="none"
             role="img" aria-label="Blue brain logo">
            <g stroke="#20cfff" stroke-width="4"
               stroke-linecap="round" stroke-linejoin="round">
                <path d="M48 22 C44 10 29 12 26 24 C14 22 10 37 18 45 C9 55 16 67 25 69 C21 81 34 88 44 80 C48 76 48 70 48 64 Z"/>
                <path d="M52 22 C56 10 71 12 74 24 C86 22 90 37 82 45 C91 55 84 67 75 69 C79 81 66 88 56 80 C52 76 52 70 52 64 Z"/>
                <path d="M50 21 V81"/>
                <path d="M27 30 Q40 29 35 42"/>
                <path d="M20 49 Q34 45 37 57"/>
                <path d="M30 70 Q40 65 44 77"/>
                <path d="M73 30 Q60 29 65 42"/>
                <path d="M80 49 Q66 45 63 57"/>
                <path d="M70 70 Q60 65 56 77"/>
            </g>
        </svg>

        <h1>BrainBox <span>Learning</span></h1>

        <p class="subtitle">
            THINK BIG. LEARN MORE. DISCOVER EVERYTHING.
        </p>

        <button class="start-button" onclick="openEmailForm()">
            Get Started →
        </button>

    </main>

    <div class="modal" id="emailModal" role="dialog"
         aria-modal="true" aria-labelledby="formTitle">
        <div class="modal-content">
            <button class="close-button" onclick="closeEmailForm()"
                    aria-label="Close">&times;</button>

            <h2 id="formTitle">Welcome to BrainBox!</h2>
            <p>Enter your email address to get started.</p>

            <form id="emailForm">
                <input
                    class="email-input"
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

                <button class="continue-button" type="submit">
                    Continue →
                </button>
            </form>

            <p id="message" aria-live="polite"></p>
        </div>
    </div>

    <script>
        const modal = document.getElementById("emailModal");
        const emailInput = document.getElementById("email");
        const message = document.getElementById("message");

        function openEmailForm() {
            modal.style.display = "flex";
            message.textContent = "";
            emailInput.focus();
        }

        function closeEmailForm() {
            modal.style.display = "none";
        }

        modal.addEventListener("click", function(event) {
            if (event.target === modal) {
                closeEmailForm();
            }
        });

        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                closeEmailForm();
            }
        });

        document.getElementById("emailForm").addEventListener(
            "submit", function(event) {
                event.preventDefault();

                const email = emailInput.value.trim();

                if (!emailInput.checkValidity() || !email) {
                    emailInput.reportValidity();
                    return;
                }

                message.textContent =
                    "Thanks! Your email is " + email +
                    ". The next step is coming soon!";
            }
        );
    </script>

</body>
</html>
