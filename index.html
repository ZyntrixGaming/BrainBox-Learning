
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BrainBox Learning</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(
        135deg,
        #061a40,
        #0353a4,
        #4cc9f0
      );
      color: white;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 82px);
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 22px;
      text-shadow: 0 4px 25px rgba(0, 0, 0, 0.2);
    }

    p {
      font-size: clamp(17px, 2.5vw, 23px);
      line-height: 1.7;
      max-width: 650px;
      color: #e0f2fe;
    }

    .line {
      width: 90px;
      height: 5px;
      border-radius: 10px;
      background: #7df9ff;
      margin-bottom: 28px;
    }
  </style>
</head>

<body>

  <main class="hero">
    <h1>BrainBox Learning</h1>

    <div class="line"></div>

    <p>
      An inspiring journey for students to learn,
      explore, and discover.
    </p>
  </main>

</body>
</html>
