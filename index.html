
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainBox Learning</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background: linear-gradient(135deg, #050816, #101642, #24104b);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background dots */
        #background-dots {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .dot {
            position: absolute;
            border-radius: 50%;
            background: #a5a5ff;
            box-shadow: 0 0 8px #7465ff, 0 0 18px #7465ff;
            animation: floatDot 5s ease-in-out infinite alternate;
        }

        @keyframes floatDot {
            0% {
                transform: translateY(0) scale(0.8);
                opacity: 0.25;
            }
            50% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-30px) scale(1.2);
                opacity: 0.45;
            }
        }

        /* Main content */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 850px;
            padding: 30px 20px;
        }

        .brain-icon {
            width: 170px;
            height: 170px;
            margin: 0 auto 20px;
            filter: drop-shadow(0 0 15px #6b5cff);
        }

        h1 {
            font-size: clamp(38px, 7vw, 68px);
            margin: 10px 0 15px;
            font-weight: 800;
            background: linear-gradient(90deg, #ffffff, #a9b7ff, #c8a5ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: #c4c9e8;
            font-size: 16px;
            letter-spacing: 3px;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        /* Get Started button */
        .start-button {
            display: inline-block;
            padding: 17px 38px;
            border: none;
            border-radius: 40px;
            background: linear-gradient(90deg, #4169ff, #9655ff);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(105, 91, 255, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(137, 91, 255, 0.8);
        }

        .footer {
            margin-top: 45px;
            color: #777fae;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* Email popup */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            width: 100%;
            height: 100%;
            padding: 20px;
            background: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 35px 25px;
            border: 1px solid #655cff;
            border-radius: 20px;
            background: linear-gradient(145deg, #111936, #241447);
            box-shadow: 0 0 35px rgba(101, 92, 255, 0.35);
        }

        .modal-content h2 {
            margin-top: 0;
            font-size: 28px;
        }

        .modal-content p {
            color: #c4c9e8;
            line-height: 1.6;
        }

        .email-input {
            display: block;
            width: 100%;
            margin: 25px 0 15px;
            padding: 15px;
            border: 1px solid #555c91;
            border-radius: 10px;
            outline: none;
            background: #080d23;
            color: white;
            font-size: 16px;
        }

        .email-input:focus {
            border-color: #8b70ff;
        }

        .continue-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #4169ff, #9655ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-button {
            position: absolute;
            top: 12px;
            right: 17px;
            border: none;
            background: transparent;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }

        #message {
            margin-top: 18px;
            color: #b9ffda;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            .brain-icon {
                width: 135px;
                height: 135px;
            }

            .subtitle {
                font-size: 12px;
                letter-spacing: 2px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .dot {
                animation: none;
            }

            .start-button {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <!-- Background dots -->
    <div id="background-dots" aria-hidden="true">
        <span class="dot" style="left:5%;top:15%;width:4px;height:4px;animation-delay:0s"></span>
        <span class="dot" style="left:12%;top:65%;width:6px;height:6px;animation-delay:1s"></span>
        <span class="dot" style="left:20%;top:35%;width:3px;height:3px;animation-delay:2s"></span>
        <span class="dot" style="left:27%;top:85%;width:5px;height:5px;animation-delay:.5s"></span>
        <span class="dot" style="left:35%;top:18%;width:6px;height:6px;animation-delay:1.5s"></span>
        <span class="dot" style="left:42%;top:60%;width:4px;height:4px;animation-delay:2.5s"></span>
        <span class="dot" style="left:50%;top:8%;width:5px;height:5px;animation-delay:1s"></span>
        <span class="dot" style="left:58%;top:82%;width:6px;height:6px;animation-delay:2s"></span>
        <span class="dot" style="left:65%;top:28%;width:3px;height:3px;animation-delay:3s"></span>
        <span class="dot" style="left:72%;top:65%;width:5px;height:5px;animation-delay:1.5s"></span>
        <span class="dot" style="left:80%;top:12%;width:4px;height:4px;animation-delay:2.5s"></span>
        <span class="dot" style="left:88%;top:42%;width:6px;height:6px;animation-delay:.5s"></span>
        <span class="dot" style="left:95%;top:78%;width:4px;height:4px;animation-delay:2s"></span>
        <span class="dot" style="left:8%;top:92%;width:3px;height:3px;animation-delay:3s"></span>
        <span class="dot" style="left:32%;top:48%;width:4px;height:4px;animation-delay:1s"></span>
        <span class="dot" style="left:62%;top:48%;width:3px;height:3px;animation-delay:2s"></span>
        <span class="dot" style="left:91%;top:92%;width:5px;height:5px;animation-delay:1.5s"></span>
        <span class="dot" style="left:17%;top:8%;width:4px;height:4px;animation-delay:2.5s"></span>
        <span class="dot" style="left:76%;top:90%;width:3px;height:3px;animation-delay:.8s"></span>
        <span class="dot" style="left:45%;top:93%;width:5px;height:5px;animation-delay:1.8s"></span>
    </div>

    <!-- Main page -->
    <main class="container">

        <!-- Neon brain icon -->
        <svg class="brain-icon"
             viewBox="0 0 200 200"
             xmlns="http://www.w3.org/2000/svg"
             aria-label="Neon brain icon"
             role="img">

            <defs>
                <linearGradient id="brainGradient"
                                x1="0%" y1="0%"
                                x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#38d9ff"/>
                    <stop offset="50%" stop-color="#7465ff"/>
                    <stop offset="100%" stop-color="#d45bff"/>
                </linearGradient>
            </defs>

            <g fill="none"
               stroke="url(#brainGradient)"
               stroke-width="4"
               stroke-linecap="round"
               stroke-linejoin="round">

                <path d="M96 35
                         C82 17 57 27 57 47
                         C36 44 27 67 39 81
                         C20 96 32 120 47 124
                         C40 145 59 161 77 150
                         C84 169 101 161 101 145
                         L101 43
                         C101 37 99 35 96 35 Z"/>

                <path d="M104 35
                         C118 17 143 27 143 47
                         C164 44 173 67 161 81
                         C180 96 168 120 153 124
                         C160 145 141 161 123 150
                         C116 169 99 161 99 145
                         L99 43
                         C99 37 101 35 104 35 Z"/>

                <path d="M57 49 C75 49 79 65 69 76"/>
                <path d="M39 81 C56 78 64 91 57 104"/>
                <path d="M47 124 C63 117 76 128 75 143"/>
                <path d="M143 49 C125 49 121 65 131 76"/>
                <path d="M161 81 C144 78 136 91 143 104"/>
                <path d="M153 124 C137 117 124 128 125 143"/>
                <path d="M73 94 C84 88 90 96 89 108"/>
                <path d="M127 94 C116 88 110 96 111 108"/>
            </g>

            <circle cx="100" cy="92" r="5" fill="#ffffff"/>
            <circle cx="100" cy="92" r="11"
                    fill="none" stroke="#7b77ff" stroke-width="2"/>
        </svg>

        <h1>BrainBox Learning</h1>

        <p class="subtitle">
            THINK BIG. LEARN MORE. DISCOVER EVERYTHING.
        </p>

        <button type="button"
                class="start-button"
                onclick="openEmailForm()">
            Get Started →
        </button>

        <div class="footer">
            YOUR JOURNEY TO KNOWLEDGE STARTS HERE
        </div>

    </main>

    <!-- Email popup -->
    <div id="emailModal" class="modal">
        <div class="modal-content">

            <button type="button"
                    class="close-button"
                    onclick="closeEmailForm()"
                    aria-label="Close popup">
                &times;
            </button>

            <h2>Let's Get Started!</h2>

            <p>Enter your email to begin your BrainBox Learning journey.</p>

            <form id="emailForm">
                <input
                    type="email"
                    id="email"
                    class="email-input"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

                <button type="submit" class="continue-button">
                    Continue →
                </button>
            </form>

            <div id="message" role="status"></div>
        </div>
    </div>

    <script>
        const emailModal = document.getElementById("emailModal");
        const emailForm = document.getElementById("emailForm");
        const emailInput = document.getElementById("email");
        const message = document.getElementById("message");

        function openEmailForm() {
            emailModal.style.display = "flex";
            message.textContent = "";
            emailInput.focus();
        }

        function closeEmailForm() {
            emailModal.style.display = "none";
        }

        // Close the popup when clicking outside it
        emailModal.addEventListener("click", function(event) {
            if (event.target === emailModal) {
                closeEmailForm();
            }
        });

        // Display a confirmation message
        emailForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const email = emailInput.value.trim();

            if (email) {
                message.textContent =
                    "Thanks! Your email is " + email +
                    ". More features are coming soon!";
            }
        });

        // Allow Escape to close the popup
        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                closeEmailForm();
            }
        });
    </script>

</body>
</html>
