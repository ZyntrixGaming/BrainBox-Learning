```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainBox Learning</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #080d20, #171044, #101b3b);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            text-align: center;
            background: rgba(18, 25, 55, 0.9);
            border: 1px solid #6554d9;
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(104, 80, 255, 0.25);
        }

        .brain {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            margin: 5px 0 12px;
            color: #c4b5fd;
        }

        .subtitle {
            font-size: 12px;
            letter-spacing: 2px;
            line-height: 1.8;
            color: #cbd5ff;
            margin-bottom: 28px;
        }

        input {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 13px 0;
            border: 1px solid #4e5681;
            border-radius: 9px;
            background: #0d1430;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #a78bfa;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(90deg, #6554e8, #9333ea);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            color: #fca5a5;
            font-size: 14px;
            margin-top: 15px;
        }

        .note {
            color: #9ca8d4;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="brain">🧠</div>

        <h1>BrainBox Learning</h1>

        <p class="subtitle">
            THINK BIG. LEARN MORE.<br>
            DISCOVER EVERYTHING.
        </p>

        <form id="signupForm">
            <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Create a password (8+ characters)"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <button type="submit">Sign Up / Get Started</button>

            <p id="message"></p>
        </form>

        <p class="note">
            Start exploring. Keep discovering.
        </p>
    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            if (!email || password.length < 8) {
                message.textContent = "Enter a valid email and a password with at least 8 characters.";
                return;
            }

            // Demo only: this does not create or save a real account.
            // A secure authentication service is needed for real sign-ups.
            window.location.href = "page2.html";
        });
    </script>
</body>
</html>
