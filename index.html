
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainBox Learning</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7ff;
      color: #172554;
      min-height: 100vh;
    }

    header {
      padding: 25px 8%;
      background: white;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #3156d8;
    }

    main {
      min-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      text-align: center;
    }

    .hero {
      max-width: 750px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 72px);
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: #3156d8;
    }

    .hero p {
      font-size: 19px;
      line-height: 1.7;
      color: #64748b;
      margin-bottom: 35px;
    }

    .get-started {
      display: inline-block;
      padding: 16px 38px;
      background: #3156d8;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(49, 86, 216, 0.25);
      transition: 0.2s;
    }

    .get-started:hover {
      background: #2444b8;
      transform: translateY(-3px);
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">BrainBox Learning</div>
  </header>

  <main>
    <section class="hero">
      <h1>Welcome to <span>BrainBox Learning</span></h1>

      <p>
        Learn something new, explore your interests,
        and unlock your potential. Your learning
        journey starts here!
      </p>

      <a href="#" class="get-started">Get Started</a>
    </section>
  </main>

  <footer>
    © 2026 BrainBox Learning
  </footer>

</body>
</html>
