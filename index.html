<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainBox Learning</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #080d20, #171044, #101b3b);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 45px 30px;
            text-align: center;
            background: rgba(18, 25, 55, 0.95);
            border: 1px solid #6554d9;
            border-radius: 22px;
            box-shadow: 0 0 35px #6554d933;
        }

        .brain {
            font-size: 70px;
            margin-bottom: 10px;
        }

        h1 {
            color: #c4b5fd;
            font-size: 36px;
            margin: 10px 0;
        }

        .subtitle {
            color: #cbd5ff;
            font-size: 12px;
            letter-spacing: 2px;
            line-height: 1.9;
            margin: 20px 0 30px;
        }

        .button {
            display: inline-block;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #6554e8, #9333ea);
            color: white;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
        }

        .button:hover {
            transform: translateY(-3px);
            filter: brightness(1.15);
        }

        .note {
            color: #9ca8d4;
