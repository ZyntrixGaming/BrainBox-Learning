```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | BrainBox Learning</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #080d20, #171044, #101b3b);
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 35px;
            text-align: center;
            background: rgba(18, 25, 55, 0.95);
            border: 1px solid #6554d9;
            border-radius: 20px;
            box-shadow: 0 0 35px #6554d933;
        }

        .brain {
            font-size: 55px;
        }

        h1 {
            color: #c4b5fd;
            font-size: 30px;
        }

        p {
            color: #cbd5ff;
            line-height: 1.6;
        }

        input {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #4e5681;
            border-radius: 9px;
            background: #0d1430;
            color: white;
            font-size: 15px;
        }

        input::placeholder {
            color: #a5afd3;
        }

        input:focus {
            outline: 2px solid #a78bfa;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(90deg, #6554e8, #9333ea);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.15);
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #c4b5fd;
            text-decoration: none;
        }

        #message {
            color: #fca5a5;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="brain">🧠</div>

        <h1>Welcome to BrainBox!</h1>

        <p>Enter your details to continue learning.</p>

        <form id="loginForm">
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Continue</button>

            <p id="message"></p>
        </form>

        <a class="back" href="index.html">← Back to Home</a>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            if (!email || !password) {
                message.textContent = "Please enter your email and password.";
                return;
            }

            // Demo only: credentials are not verified or saved.
            // Replace this with secure authentication before using real accounts.
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
```
